info:
  name: Events - Edit - 204
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/events"
  body:
    type: json
    data: |-
      {
        "id": "0ae78c6a-73d5-43a6-9f5f-6056ccc0da6f",
        "title": "{{$randomCatchPhrase}}",
        "date": "{{$randomDateFuture}}",
        "description": "{{$randomLoremParagraph}}",
        "category": "music",
        "isCancelled": false,
        "city": "{{$randomCity}}",
        "venue": "{{$randomStreetName}}",
        "latitude": "21.0997",
        "longitude": "-86.7561"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404 Not Found", function (){
          expect(res.getStatus()).to.equal(404);
        })

        test("Response returns an array", function() {
          const body = res.getBody();
          expect(body).to.equal("The event was not found");
        })

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
